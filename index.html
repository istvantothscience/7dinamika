<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler-452b Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --emergency-orange: #ff8c00; /* Neon narancs */
            --deep-space: #0a0b10;
        }

        body {
            background-color: var(--deep-space);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 80%);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #terminal-container {
            width: 450px;
            padding: 40px;
            border: 2px solid var(--emergency-orange);
            background: rgba(10, 11, 16, 0.9);
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.3);
            text-align: center;
            position: relative;
        }

        /* AZONOSÍTSA MAGÁT KADÉT - Narancssárga stílus */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--emergency-orange);
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            opacity: 0.7;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--emergency-orange);
            color: var(--emergency-orange);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--emergency-orange);
            color: var(--deep-space);
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .scanline {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.02) 50%);
            background-size: 100% 4px;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="terminal-container">
        <div class="scanline"></div>
        <h1 class="main-title">Azonosítsa magát kadét</h1>
        <p class="subtitle">Kepler-452b | Newton-1 túlélő adatbázis</p>
        
        <div class="input-group">
            <label>SZEMÉLYI AZONOSÍTÓ (NÉV):</label>
            <input type="text" id="student-name" placeholder="Írja be a nevét...">
        </div>

        <div class="input-group">
            <label>HOZZÁFÉRÉSI KÓD (JELSZÓ):</label>
            <input type="password" id="student-pass" placeholder="****">
        </div>

        <button onclick="login()">RENDSZER BELÉPÉS</button>

        <div id="status-msg"></div>
    </div>

    <script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgg81waFHRcbnE_jzWVpxRb4F2F3LppiBklaVIdDaVj7qpT4b1douJwlwbIGpj2Ag1JDFOYl1PcHwY/pub?output=csv';

async function login() {
  

        async function login() {
            const name = document.getElementById('student-name').value;
            const pass = document.getElementById('student-pass').value;
            const status = document.getElementById('status-msg');

            if (!name || !pass) {
                status.innerText = "HIBA: HIÁNYZÓ ADATOK!";
                status.style.color = "red";
                return;
            }

            status.innerText = "KAPCSOLÓDÁS AZ ADATBANKHOZ...";
            status.style.color = "var(--neon-cyan)";
            
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => row.split(','));

                // Keresés a 0. (Név) és 1. (Jelszó) oszlopban
                const user = rows.find(r => 
                    r[0] && r[0].trim().toLowerCase() === name.trim().toLowerCase() && 
                    r[1] && r[1].trim() === pass.trim()
                );

                if (user) {
                    status.innerText = "AZONOSÍTÁS SIKERES. ÜDVÖZÖLJÜK!";
                    status.style.color = "#00ff00";
                    
                    // Adatok mentése
                    localStorage.setItem('currentUser', JSON.stringify({
                        name: user[0],
                        level: user[28],
                        points: user[26]
                    }));
                    
                    // Átirányítás a Küldetésekhez
                    setTimeout(() => {
                        window.location.href = "missions.html";
                    }, 1500);
                } else {
                    status.innerText = "HIBA: ISMERETLEN KADÉT VAGY HIBÁS KÓD!";
                    status.style.color = "red";
                }
            } catch (e) {
                status.innerText = "RENDSZERHIBA: NINCS KAPCSOLAT.";
                console.error(e);
            }
        }
    </script>
</body>
</html>
