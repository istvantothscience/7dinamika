<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler-452b Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --emergency-orange: #ff8c00;
            --deep-space: #0a0b10;
        }

        body {
            background-color: var(--deep-space);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 80%);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #terminal-container {
            width: 450px;
            padding: 40px;
            border: 2px solid var(--emergency-orange);
            background: rgba(10, 11, 16, 0.85);
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--emergency-orange);
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--emergency-orange);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--emergency-orange);
            color: var(--emergency-orange);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--emergency-orange);
            color: var(--deep-space);
            box-shadow: 0 0 20px var(--emergency-orange);
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .scanline {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.02) 50%);
            background-size: 100% 4px;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="terminal-container">
        <div class="scanline"></div>
        <h1 class="main-title">Azonosítsa magát kadét</h1>
        <p class="subtitle">Kepler-452b | Newton-1 túlélő adatbázis</p>
        
        <div class="input-group">
            <label>SZEMÉLYI AZONOSÍTÓ:</label>
            <input type="text" id="student-name" placeholder="Név beírása...">
        </div>

        <div class="input-group">
            <label>HOZZÁFÉRÉSI KÓD:</label>
            <input type="password" id="student-pass" placeholder="****">
        </div>

        <button onclick="login()">RENDSZER BELÉPÉS</button>

        <div id="status-msg"></div>
    </div>

    <script>
        // Ide írd majd be a Google Sheet-ed CSV linkjét!
        const CSV_URL = 'IDE_MASOLD_A_CSV_LINKET';

        async function login() {
            const name = document.getElementById('student-name').value;
            const pass = document.getElementById('student-pass').value;
            const status = document.getElementById('status-msg');

            if (!name || !pass) {
                status.innerText = "HIBA: AZONOSÍTÓ ÉS KÓD SZÜKSÉGES!";
                status.style.color = "#ff4444";
                return;
            }

            status.innerText = "ADATOK ELLENŐRZÉSE...";
            status.style.color = "var(--neon-cyan)";
            
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                // Egyszerű CSV parzoló (sorok és oszlopok)
                const rows = csvText.split('\n').map(row => row.split(','));

                // Keresés: r[0] a név, r[1] a jelszó a Google Táblázatban
                const user = rows.find(r => 
                    r[0] && r[0].trim().toLowerCase() === name.trim().toLowerCase() && 
                    r[1] && r[1].trim() === pass.trim()
                );

                if (user) {
                    status.innerText = "AZONOSÍTÁS SIKERES. ÜDVÖZÖLJÜK!";
                    status.style.color = "#00ff00";
                    
                    // Adatok mentése a böngészőbe a következő oldalhoz
                    localStorage.setItem('currentUser', JSON.stringify({
                        name: user[0],
                        points: user[26],
                        type: user[27],
                        level: user[28]
                    }));
                    
                    setTimeout(() => {
                        window.location.href = "missions.html";
                    }, 1500);
                } else {
                    status.innerText = "HOZZÁFÉRÉS MEGTAGADVA! ISMERETLEN KADÉT.";
                    status.style.color = "#ff4444";
                }
            } catch (e) {
                status.innerText = "RENDSZERHIBA: KAPCSOLATI HIBA AZ ADATBÁZISSAL.";
                console.error(e);
            }
        }
    </script>
</body>
</html>
