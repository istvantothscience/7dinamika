<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler-452b - Mellékküldetések</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f2ff;
            --orange: #ff8c00;
            --bg: #0a0b10;
            --locked: #1a1b25;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 90%);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-family: 'Orbitron';
            color: var(--orange);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(0, 242, 255, 0.03);
            border: 1px solid var(--cyan);
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover:not(.locked) {
            background: rgba(0, 242, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            transform: translateY(-5px);
        }

        /* Zárolt kártya stílusa */
        .card.locked {
            border-color: #333;
            background: var(--locked);
            color: #555;
            filter: grayscale(1);
        }

        .card h3 {
            font-family: 'Orbitron';
            margin-top: 0;
            color: var(--cyan);
        }

        .locked h3 { color: #555; }

        .mission-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--orange);
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border: 1px solid;
            display: inline-block;
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-family: 'Orbitron';
            font-weight: bold;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            transition: 0.3s;
            margin-top: 20px;
        }

        .card:not(.locked) .btn:hover {
            background: var(--cyan);
            color: var(--bg);
        }

        .locked .btn {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        .lock-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <header style="margin-bottom: 30px;">
        <a href="missions.html" style="color: var(--cyan); text-decoration: none;">< VISSZA A PARANCSNOKSÁGRA</a>
    </header>

    <h1>Mellékküldetések</h1>

    <div class="grid" id="side-grid">
        </div>

   <script>
    // --- KONFIGURÁCIÓ ---
    // A te saját Google Apps Script linked
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVEmP0Vi-O_PM9I5UIrcJVzKxRkOcBGD8efufcpiiKm269PSSYRaeZTlnTUs2Edt3jiQ/exec"; 

    // ... (itt marad a többi változatlan kód: canvas, chart, quizData stb.) ...
    // Görgess le a checkQuiz és sendPoints függvényekhez:

    function checkQuiz() {
        let score = 0;
        quizData.forEach((d, i) => { if(userAnswers[i] === d.c) score++; });
        const res = document.getElementById('result-display');
        res.style.display = "block";
        res.innerHTML = `DIAGNÓZIS: ${score} / ${quizData.length} adat helyes.`;
        
        if(score === quizData.length) {
            res.style.borderColor = "#00f2ff";
            res.style.color = "#00f2ff";
            
            // FONTOS: Itt küldjük az sm1 azonosítót!
            sendPoints(10, "sm1"); 
        } else {
            res.style.borderColor = "#ff8c00";
            res.style.color = "#ff8c00";
        }
    }

    // EBBŐL A FÜGGVÉNYBŐL CSAK EZ AZ EGY MARADJON!
    function sendPoints(points, missionId) {
        const userData = JSON.parse(localStorage.getItem('currentUser'));
        if(!userData || !SCRIPT_URL) {
            console.error("Hiba: Nincs felhasználó vagy URL!");
            return;
        }

        // Felépítjük a pontos URL-t a mission paraméterrel
        const finalUrl = `${SCRIPT_URL}?name=${encodeURIComponent(userData.name)}&points=${points}&mission=${missionId}`;

        console.log("Küldés folyamatban ide:", finalUrl);

        fetch(finalUrl, {
            method: 'GET',
            mode: 'no-cors'
        })
        .then(() => {
            alert("SIKERES ADATKÜLDÉS! A pontszámod rögzítve az I oszlopban.");
        })
        .catch(err => {
            console.error("Hiba a hálózati kérésnél:", err);
            alert("Hálózati hiba történt az adatküldés során.");
        });
    }

    // A többi marad: window.onload = () => { setupCanvas(); renderQuiz(); updateUI(); };
</script>
</body>
</html>
