<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler-452b - Mellékküldetések</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f2ff;
            --orange: #ff8c00;
            --bg: #0a0b10;
            --locked: #1a1b25;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 90%);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-family: 'Orbitron';
            color: var(--orange);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(0, 242, 255, 0.03);
            border: 1px solid var(--cyan);
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover:not(.locked) {
            background: rgba(0, 242, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            transform: translateY(-5px);
        }

        .card.locked {
            border-color: #333;
            background: var(--locked);
            color: #555;
            filter: grayscale(1);
        }

        .card h3 {
            font-family: 'Orbitron';
            margin-top: 0;
            color: var(--cyan);
        }

        .locked h3 { color: #555; }

        .mission-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--orange);
        }

        .btn {
            display: block;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-family: 'Orbitron';
            font-weight: bold;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            transition: 0.3s;
            margin-top: 20px;
        }

        .card:not(.locked) .btn:hover {
            background: var(--cyan);
            color: var(--bg);
        }

        .locked .btn {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header style="margin-bottom: 30px;">
        <a href="missions.html" style="color: var(--cyan); text-decoration: none;">< VISSZA A PARANCSNOKSÁGRA</a>
    </header>

    <h1>Mellékküldetések</h1>

    <div class="grid" id="side-grid">
        </div>

<script>
    // MELLÉKKÜLDETÉSEK ADATAI
    const sideMissions = [
        {
            id: "sm1",
            title: "S.M. 01",
            name: "Ionrugós hipertérugrás",
            desc: "Teszteld az ionrugók erejét és a tömeg kapcsolatát a gyorsulással.",
            file: "sm1_test.html",
            locked: false
        },
        {
            id: "sm2",
            title: "S.M. 02",
            name: "Gravitációs hinta",
            desc: "Zárolt tartalom. Fejlesztés alatt...",
            file: "#",
            locked: true
        },
        {
            id: "sm3",
            title: "S.M. 03",
            name: "Foton-ágyú kalibráció",
            desc: "Zárolt tartalom. Fejlesztés alatt...",
            file: "#",
            locked: true
        }
    ];

    function renderMissions() {
        const grid = document.getElementById('side-grid');
        grid.innerHTML = sideMissions.map(m => `
            <div class="card ${m.locked ? 'locked' : ''}">
                <div>
                    <div class="mission-title">${m.title}</div>
                    <h3>${m.name}</h3>
                    <p>${m.desc}</p>
                </div>
                ${m.locked ? 
                    `<div class="btn">ZÁROLT</div>` : 
                    `<a href="${m.file}" class="btn">INDÍTÁS</a>`
                }
            </div>
        `).join('');
    }

    // Oldal betöltésekor kártyák kirajzolása
    window.onload = renderMissions;
</script>

</body>
</html>
