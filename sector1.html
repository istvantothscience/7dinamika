<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector 1 - Az Erő</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f2ff;
            --orange: #ff8c00;
            --bg: #0a0b10;
        }

        body {
            background-color: var(--bg);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            border-bottom: 1px solid var(--orange);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
        }

        .back-btn { 
            color: var(--orange); 
            text-decoration: none; 
            font-family: 'Orbitron'; 
            border: 1px solid var(--orange); 
            padding: 5px 15px;
        }

        /* Prológus Elrendezés */
        .prologue-section {
            display: flex;
            margin-top: 30px;
            gap: 40px;
            align-items: flex-start;
        }

        .text-container {
            flex: 2;
        }

        /* Írógép effektus és sárga kurzor */
        .typewriter-text {
            line-height: 1.8;
            text-align: justify;
            font-size: 1.1rem;
            color: #e0faff;
            position: relative;
            display: inline;
        }

        .typewriter-text::after {
            content: "";
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: var(--orange);
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Kép stílusa: Jobb oldalt, fele akkora */
        .image-container {
            flex: 0 0 250px; /* Lefelezve (kb. 250px széles) */
            border: 1px solid var(--cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            background: #000;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: sepia(0.3) hue-rotate(150deg); /* Kékes sci-fi filter */
        }

        h2 {
            font-family: 'Orbitron';
            color: var(--orange);
            margin-top: 0;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-family: 'Orbitron';">MISSION LOG: SECTOR_01</div>
        <a href="sectors.html" class="back-btn">< VISSZA</a>
    </header>

    <div class="prologue-section">
        <div class="text-container">
            <h2>PROLÓGUS</h2>
            <div id="typed-text" class="typewriter-text"></div>
        </div>

        <div class="image-container">
            <img src="images/sector1.png" alt="Newton-1 roncsok">
        </div>
    </div>
            <div id="action-zone" style="display:none; text-align: center; margin-top: 50px;">
    <a href="sector1_task.html" class="launch-btn">DIAGNOSZTIKA INDÍTÁSA</a>
</div>

<style>
    .launch-btn {
        display: inline-block;
        padding: 15px 40px;
        border: 2px solid var(--orange);
        color: var(--orange);
        text-decoration: none;
        font-family: 'Orbitron';
        font-weight: bold;
        letter-spacing: 3px;
        transition: 0.3s;
        background: rgba(255, 140, 0, 0.1);
        box-shadow: 0 0 15px rgba(255, 140, 0, 0.2);
    }
    .launch-btn:hover {
        background: var(--orange);
        color: var(--bg);
        box-shadow: 0 0 30px var(--orange);
    }
</style>

<script>
    // Módosítsuk a typeWriter végét, hogy a gomb megjelenjen:
    function typeWriter() {
        if (i < text.length) {
            target.innerHTML += text.substring(i, i + charsPerStep);
            i += charsPerStep;
            setTimeout(typeWriter, speed);
        } else {
            // Megjelenítjük a gombot, ha a szöveg végére értünk
            document.getElementById("action-zone").style.display = "block";
        }
    }
</script>

    <script>
       // A feltöltött szöveged
const text = `A galaxis nyugati spirálkarjának egyik kifejezetten jelentéktelen szegletében a Newton-1 kutatóhajó legénysége éppen azon vitatkozott, hogy a szintetikus kávé miért hasonlít ízében egy használt ionhajtómű hűtővizére, ami egyébként egyike azon kevés kozmikus rejtélyeknek, amelyekre még a szuperszámítógépek sem tudnak megnyugtató választ adni. Ez volt az utolsó értelmes gondolatuk, mielőtt a Kepler-452b narancssárga, kénszagú atmoszférája úgy döntött, hogy szorosabb barátságot köt a hajó burkolatával, fittyet hányva a jó ízlésre és a menetrendre. A katasztrófa oka egy sajnálatos gravitációs anomália volt, és miközben a hajófedélzeti számítógép még udvariasan megjegyezte, hogy a bolygó éppen most készül palacsintává lapítani mindenkit. Amikor a por leülepedett – vagy legalábbis megpróbált –, a Newton-1 roncsa úgy festett a narancssárga ködben, mint egy óriási fém-articsóka, amit egy dühös óriás rágott meg. Fojtogató füst gomolygott a roncsok közül, és a legénység tagjai, akik eddig a biztonsági öveik és a légzsákok jótékony tehetetlenség-gátló hatásában bíztak, most feltűnő nehézkedéssel küzdve másztak ki a kettétört törzsből. Elsőként a Pilóta bukkant fel, egy ember, aki képes lenne egy téglafalat is navigálni, feltéve, ha van rajta elég hajtómű, és aki szentül hiszi, hogy a tehetetlenség törvénye csak egy barátságos javaslat. Őt követte a Műszerész, aki már most a roncsok alakváltozását elemezte , és halkan szitkozódott, mert a kedvenc villáskulcsa éppen most hajtott végre egy végleges távozást a mélybe. A Technológus és a Tudós egymást segítve kászálódtak ki a füstölgő kabinból. A Technológus már a narancssárga por láttán a tapadási súrlódáson kezdett el mélabúsan morfondírozni; szerinte ugyanis a galaktikus menekülés nem más, mint a súrlódás elkerülésének magas szintű művészete. Eközben a Tudós – aki leginkább egy két lábon járó, kissé pánikoló számológépre emlékeztetett – még mindig azon rágódott, hogy a becsapódás közbeni, igencsak barátságtalan mértékű gyorsulás nem tette-e végleg tönkre a frizurájátt. Ahogy ott ácsorogtak a füstös, idegen tájon, hirtelen megvilágosodtak: ugyanazok a brutális erőhatások , amelyek oly kíméletlenül megváltoztatták a hajójuk mozgásállapotát, egyúttal a hajtómű fúvókáit és a navigációs chipeket is szerteszét szórták a bolygó barátságtalan pontjain. Odakint a sötétben valami kattogott, valami éhes volt, és a legénységnek rá kellett döbbennie: ha nem akarják, hogy a félresikerült landolás legyen az utolsó fizikai élményük ebben a megmagyarázhatatlanul narancssárga univerzumban, sürgősen építeniük kell valamit, ami legalább nyomokban tartalmaz egy működő rakétát.`;

let i = 0;
const speed = 5; // Extra gyors sebesség
const charsPerStep = 3; // Lépésenként 3 karaktert ír ki a gyorsításért
const target = document.getElementById("typed-text");

function typeWriter() {
    if (i < text.length) {
        // Egyszerre több karaktert fűzünk hozzá, hogy kijöjjön a ~3 másodperc
        target.innerHTML += text.substring(i, i + charsPerStep);
        i += charsPerStep;
        setTimeout(typeWriter, speed);
    }
}

window.onload = typeWriter;
    </script>

</body>
</html>
