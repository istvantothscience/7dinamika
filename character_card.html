<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Karakter Profil - Kepler-452b</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Ide másold be a korábbi Character Card CSS-t (neon keret, flexbox stb.) */
        body { background: #0a0b10; color: #00f2ff; font-family: 'Share Tech Mono'; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { border: 2px solid #00f2ff; padding: 20px; display: flex; gap: 20px; background: rgba(0,0,0,0.8); box-shadow: 0 0 20px rgba(0,242,255,0.2); border-radius: 15px; }
        #char-img { width: 200px; height: 250px; border: 1px solid #00f2ff; object-fit: cover; }
        .info h1 { font-family: 'Orbitron'; margin-top: 0; border-bottom: 2px solid #ff8c00; }
        .stat { margin: 10px 0; font-size: 1.2rem; }
        .label { color: #ff8c00; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: #00f2ff; text-decoration: none; border: 1px solid #00f2ff; padding: 5px 15px; }
    </style>
</head>
<body>

    <a href="main_menu.html" class="back-btn"> < VISSZA </a>

    <div class="card">
        <img id="char-img" src="img/placeholder.png">
        <div class="info">
            <h1 id="student-name">TÖLTÉS...</h1>
            <div class="stat"><span class="label">KASZT:</span> <span id="char-type">-</span></div>
            <div class="stat"><span class="label">RANG:</span> <span id="char-rank">-</span></div>
            <div class="stat"><span class="label">PONT:</span> <span id="char-points">0</span></div>
        </div>
    </div>

    <script>
        const userData = JSON.parse(localStorage.getItem('currentUser'));
        const scriptURL = "IDE_AZ_ÚJ_SCRIPT_URL_T";

        if (userData) {
            loadCharacter();
        }

        async function loadCharacter() {
            const url = `${scriptURL}?action=getStats&name=${encodeURIComponent(userData.name)}`;
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                
                document.getElementById('student-name').innerText = data.name.toUpperCase();
                document.getElementById('char-type').innerText = data.type;
                document.getElementById('char-points').innerText = data.points;

                // Szintszámítás
                let lvl = 1; let r = "Újonc";
                if(data.points > 100) { lvl = 2; r = "Kadét"; }
                if(data.points > 300) { lvl = 3; r = "Tisztjelölt"; }
                if(data.points > 600) { lvl = 4; r = "Hadnagy"; }
                if(data.points > 1000) { lvl = 5; r = "Parancsnok"; }

                document.getElementById('char-rank').innerText = `${r} (LVL ${lvl})`;
                document.getElementById('char-img').src = `img/${data.type}_${lvl}.png`;
            } catch(e) { console.error("Hiba!"); }
        }
    </script>
</body>
</html>
